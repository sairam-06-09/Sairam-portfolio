<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I Love You Muskan 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse,#421124,#120710 55%,#030205);color:#fff0d1;font-family:Georgia,serif;display:grid;place-items:center}
canvas{position:fixed;inset:0;width:100%;height:100%}.message{z-index:1;text-align:center;margin-top:38vh;padding:1rem;pointer-events:none}
h1{font-size:clamp(2rem,7vw,4rem);font-weight:normal;font-style:italic;text-shadow:0 0 12px #ff4776,0 0 35px #bd174c;animation:pulse 2s infinite}
.sub{font-size:clamp(1rem,3vw,1.4rem);color:#ffdb91;text-shadow:0 0 12px #d76a62}
.hint{position:fixed;bottom:12px;text-align:center;width:100%;font:12px system-ui;color:#c7a6b3}
@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.4)}}
</style></head><body><canvas id="c"></canvas><div class="message"><h1>I LOVE YOU MUSKAN</h1><div class="sub">Forever yours, Muskan 💗</div></div><div class="hint">Made with love 💗 · Tap anywhere for sparkles</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let w,h,dpr,parts=[],sparks=[],t=0;
const words=['I LOVE YOU','TE AMO',"JE T'AIME",'SENI SEVIYORUM','TI AMO','愛してる','사랑해','FOREVER','MY HEART IS YOURS'];
function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);parts=[];for(let i=0;i<450;i++)parts.push({a:Math.random()*Math.PI*2,k:.2+Math.random()*.8,word:Math.random()<.3,txt:words[Math.random()*words.length|0],s:8+Math.random()*7,p:Math.random()*6,g:Math.random()<.2})}
function heart(a,k){let X=16*Math.sin(a)**3,Y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a),s=Math.min(w,h)*.021*k;return [w/2+X*s,h*.43-Y*s]}
function draw(){t+=.016;x.clearRect(0,0,w,h);let beat=1+.035*Math.sin(t*2.5);
x.save();x.translate(w/2,h*.43);x.scale(beat,beat);x.translate(-w/2,-h*.43);x.beginPath();for(let i=0;i<=360;i++){let p=heart(i*Math.PI/180,1);i?x.lineTo(...p):x.moveTo(...p)}x.closePath();x.strokeStyle='#ff416f';x.lineWidth=2;x.shadowBlur=28;x.shadowColor='#ff174f';x.stroke();x.restore();
parts.forEach((p,i)=>{let [a,b]=heart(p.a,p.k*beat);x.globalAlpha=.6+.4*Math.sin(t*2+p.p);x.fillStyle=p.g?'#ffdf91':(i%3?'#ff4776':'#ff9caf');if(p.word&&p.k>.42){x.font=`${p.g?'italic ':'bold '}${p.s}px Georgia`;x.textAlign='center';x.fillText(p.txt,a,b)}else{x.beginPath();x.arc(a,b,1.5+(i%3)*.4,0,7);x.fill()}});x.globalAlpha=1;
sparks=sparks.filter(s=>s.l>0);sparks.forEach(s=>{s.a+=s.v;s.b+=s.u;s.l--;x.fillStyle='#ffe6a7';x.globalAlpha=s.l/50;x.fillRect(s.a,s.b,3,3)});x.globalAlpha=1;requestAnimationFrame(draw)}
c.addEventListener('pointerdown',e=>{for(let i=0;i<35;i++){let a=Math.random()*Math.PI*2,v=Math.random()*5;sparks.push({a:e.clientX,b:e.clientY,v:Math.cos(a)*v,u:Math.sin(a)*v,l:50})}});addEventListener('resize',size);size();draw();
</script></body></html>
